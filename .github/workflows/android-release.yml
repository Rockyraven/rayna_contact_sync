# Builds a release APK on a clean runner (the dev machines here have no JDK or
# Android SDK, and the EC2 box has too little RAM for Gradle). Publishing to a
# GitHub Release gives users a stable public download URL at no bandwidth cost.
name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release, e.g. v1.0.1'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Report signing fingerprint
        run: |
          # The SHA-1 registered as an Android OAuth client must match this, or
          # Google Sign-In fails on device with an unhelpful error code.
          keytool -list -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey | grep -A1 'SHA1:'

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Rayna Contact Sync ${{ inputs.version }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            Install on Android: download the APK below and allow
            "install from unknown sources" when prompted.
