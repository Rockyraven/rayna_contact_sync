services:
  server:
    build: ./server
    env_file: ./server/.env
    ports:
      - '4000:4000'
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      - '8080:80'
    restart: unless-stopped
